<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Originalis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .button {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #111827;
            font-weight: bold;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 25px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Originalis</h1>

    <p>Créer votre compte</p>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="verifier-word.html">Vérifier</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="aide.html">Aide</a>
    </nav>

</header>

<main class="container">

    <div class="form-card">

        <h2>Créer un compte</h2>

        <p class="intro">
            Rejoignez Originalis et commencez à utiliser nos outils.
        </p>

        <form>

            <label for="nom">Nom complet</label>

            <input
                type="text"
                id="nom"
                name="nom"
                placeholder="Votre nom complet"
                required
            >

            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Créez un mot de passe"
                required
            >

            <label for="confirm-password">Confirmer le mot de passe</label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirmez votre mot de passe"
                required
            >

            <button type="submit" class="button">
                Créer mon compte
            </button>

        </form>

        <div class="login-link">

            <p>
                Vous avez déjà un compte ?
                <a href="connexion.html">Se connecter</a>
            </p>

        </div>

    </div>

</main>

<footer>

    <p>© 2026 Originalis — Tous droits réservés.</p>

    <p>Analysez. Vérifiez. Améliorez.</p>

</footer>

</body>
</html>
