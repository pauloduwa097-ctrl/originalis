<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - Originalis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .button {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links p {
            margin: 10px 0;
        }

        .links a {
            color: #111827;
            font-weight: bold;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 25px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }
        }
    <style>
.welcome-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 30, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
    backdrop-filter: blur(7px);
}

.welcome-card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 24px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.30);
    animation: welcomeAppear 0.45s ease;
}

.welcome-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
}

.welcome-small {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #6b7280;
    margin-bottom: 12px;
}

.welcome-card h2 {
    font-size: 32px;
    line-height: 1.2;
    color: #111827;
    margin-bottom: 20px;
}

.welcome-card h2 span {
    font-weight: 800;
}

.welcome-line {
    width: 55px;
    height: 3px;
    background: #111827;
    margin: 0 auto 20px;
    border-radius: 10px;
}

.welcome-name {
    font-size: 21px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 12px;
}

.welcome-text {
    color: #6b7280;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 28px;
}

#continueButton {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

#continueButton:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}

@keyframes welcomeAppear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media (max-width: 600px) {
    .welcome-card {
        padding: 35px 25px;
    }

    .welcome-card h2 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>

    <h1>Originalis</h1>

    <p>Connexion à votre compte</p>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="verifier-word.html">Vérifier</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="aide.html">Aide</a>
    </nav>

</header>

<main class="container">

    <div class="form-card">

        <h2>Se connecter</h2>

        <p class="intro">
            Connectez-vous à votre compte Originalis.
        </p>

        <form>

            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" class="button">
                Se connecter
            </button>

        </form>

        <div class="links">

            <p>
                Vous n'avez pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
            </p>

            <p>
                <a href="index.html">← Retour à Originalis</a>
            </p>

        </div>

    </div>

</main>

<footer>

    <p>© 2026 Originalis — Tous droits réservés.</p>

    <p>Analysez. Vérifiez. Améliorez.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mrzsmkrgwlmaloljvfsr.supabase.co";
const SUPABASE_KEY = "sb_publishable_byx5TY7DH3itEV_ceACLVw_eBzFOeKj";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.querySelector("form");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Veuillez remplir tous les champs.");
        return;
    }

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        alert("Erreur de connexion : " + error.message);
        return;
    }

    alert("Connexion réussie ! Bienvenue sur Originalis.");

    window.location.href = "index.html";
});
</script>
</body>
</html>
