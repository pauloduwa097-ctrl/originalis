<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - Originalis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .button {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links p {
            margin: 10px 0;
        }

        .links a {
            color: #111827;
            font-weight: bold;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 25px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Originalis</h1>

    <p>Connexion à votre compte</p>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="verifier-word.html">Vérifier</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="aide.html">Aide</a>
    </nav>

</header>

<main class="container">

    <div class="form-card">

        <h2>Se connecter</h2>

        <p class="intro">
            Connectez-vous à votre compte Originalis.
        </p>

        <form>

            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" class="button">
                Se connecter
            </button>

        </form>

        <div class="links">

            <p>
                Vous n'avez pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
            </p>

            <p>
                <a href="index.html">← Retour à Originalis</a>
            </p>

        </div>

    </div>

</main>

<footer>

    <p>© 2026 Originalis — Tous droits réservés.</p>

    <p>Analysez. Vérifiez. Améliorez.</p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://mrzsmkrgwlmaloljvfsr.supabase.co";

    const SUPABASE_KEY = "sb_publishable_byx5TY7DH3itEV_ceACLVw_eBzFOeKj";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const form = document.querySelector("form");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            alert("Erreur de connexion : " + error.message);
            return;
        }

        alert("Connexion réussie ! Bienvenue sur Originalis.");

        window.location.href = "index.html";
    });
</script>
</body>
</html>
